# Revisión de errores y estilo del código Python:   python -m pip install ruff   y luego   python -m ruff check .
line-length = 130

exclude = ["panel-administrativo", "panel-docente", "comun", "node_modules"]  # lo viejo se borra al final del refactor

[lint]
select = [
    "E", "W",   # estilo (pycodestyle)
    "F",        # errores: imports y variables sin usar, nombres que no existen
    "B",        # errores probables (flake8-bugbear)
    "C4",       # comprensiones innecesarias
    "SIM",      # simplificaciones
    "RET", "PIE",
    "PLE", "PLW",
    "RUF100",   # comentarios «noqa» que ya no hacen falta
    "I",        # imports ordenados
]
ignore = [
    "E501",     # las líneas largas se revisan a ojo
    "SIM108", "SIM102", "RET504", "RET505", "PIE790",
    "B008",
]

[lint.isort]
known-first-party = ["app", "database", "soporte"]
